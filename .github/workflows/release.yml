name: Release

# Versions: the next one is in the file VERSION (e.g. 0.3.0).
# edge:   every merge to main, once CI on it is green: pre-release vX.Y.Z-dev.<run number>
# stable: every tag vX.Y.Z (cut from main, which CI has already checked); then VERSION moves on
# Every build gets its own release that never changes afterwards: a single moving "edge" release made
# GitHub serve cached links to files of an older, deleted build for minutes after each new one.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*', '!v*-dev.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.workflow_run.head_sha }}

      - name: What to release
        id: what
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            # A stable tag must name the version in VERSION, so dev builds and the release agree.
            [ "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)" ] || { echo "tag $GITHUB_REF_NAME does not match VERSION"; exit 1; }
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "channel=edge" >> "$GITHUB_OUTPUT"
            V="$(tr -d '[:space:]' < VERSION)-dev.${{ github.run_number }}"
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "tag=v$V" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the interface (embedded into the core)
        working-directory: web
        run: npm ci && npm run build

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build core and agent for linux/amd64 and linux/arm64
        run: |
          SHA=${{ steps.what.outputs.sha }}
          V=github.com/metraveer/gridlume/internal/version
          LDFLAGS="-s -w -X $V.Version=${{ steps.what.outputs.version }} -X $V.Commit=${SHA::7} -X $V.Build=${{ github.run_number }} -X $V.Channel=${{ steps.what.outputs.channel }}"
          mkdir dist
          for arch in amd64 arm64; do
            for cmd in gridlume gridlume-agent; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" -o "dist/$cmd-linux-$arch" "./cmd/$cmd"
            done
          done
          cp deploy/install-core.sh dist/
          ls -lh dist

      - name: Manifest and signature
        env:
          GRIDLUME_SIGNING_KEY: ${{ secrets.GRIDLUME_SIGNING_KEY }}
        run: |
          SHA=${{ steps.what.outputs.sha }}
          go run ./tools/release manifest dist "${{ steps.what.outputs.version }}" "${{ steps.what.outputs.channel }}" "${{ github.run_number }}" "${SHA::7}" \
            "https://github.com/${{ github.repository }}/releases/tag/${{ steps.what.outputs.tag }}"
          go run ./tools/release sign dist
          cat dist/release.json

      - name: Publish edge
        if: steps.what.outputs.channel == 'edge'
        run: |
          SHA=${{ steps.what.outputs.sha }}
          TAG=${{ steps.what.outputs.tag }}
          gh release create "$TAG" dist/* --prerelease --latest=false --target "$SHA" \
            --title "${{ steps.what.outputs.version }} (${SHA::7})" \
            --notes "Fresh build of main at ${SHA::7}. Changes: https://github.com/${{ github.repository }}/commits/$SHA"
          # Keep the five newest development builds (rollback targets); drop older ones and the old
          # "edge" / "edge-N" releases from before semantic versions.
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep -E '^edge(-[0-9]+)?$' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$' |
            awk -F'dev.' '{print $2" "$0}' | sort -n -r | tail -n +6 | cut -d' ' -f2 |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done

      - name: Publish stable
        if: steps.what.outputs.channel == 'stable'
        run: gh release create "${{ steps.what.outputs.tag }}" dist/* --title "${{ steps.what.outputs.tag }}" --generate-notes --latest
