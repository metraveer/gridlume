<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridlume — макет</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  body { overflow: hidden; }
  .app { display: grid; grid-template-columns: var(--rail-w) 1fr var(--inspector-w); grid-template-rows: var(--topbar-h) 1fr; height: 100vh; }
  .app.no-inspector { grid-template-columns: var(--rail-w) 1fr 0; }

  /* Top bar */
  .topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--s-4); padding: 0 var(--s-3) 0 0; border-bottom: 1px solid var(--line-soft); background: var(--bg-panel); }
  .brand { display: flex; align-items: center; gap: 10px; width: var(--rail-w); justify-content: center; }
  .brand-name { font-weight: 600; letter-spacing: -0.01em; margin-left: -6px; }
  .brand-wrap { display: flex; align-items: center; gap: 0; }
  .search { position: relative; }
  .search .icon { position: absolute; left: 10px; top: 7px; color: var(--fg-faint); }
  .search .input { width: 280px; padding-left: 32px; }
  .search .kbd { position: absolute; right: 8px; top: 7px; }
  .spacer { flex: 1; }
  .avatar { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--bg-active); color: var(--fg-muted); font-size: var(--fs-11); font-weight: 600; }
  .alert-count { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px var(--bg-panel); }

  /* Rail */
  .rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: var(--s-2) 0; border-right: 1px solid var(--line-soft); background: var(--bg-panel); }
  .rail .bottom { margin-top: auto; }

  /* Canvas */
  .canvas { position: relative; overflow: hidden; background-color: var(--bg-canvas);
    background-image: radial-gradient(var(--line-soft) 1px, transparent 1px); background-size: 24px 24px; cursor: grab; }
  .canvas.panning { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .world svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .canvas-tools { position: absolute; top: var(--s-3); left: var(--s-3); display: flex; gap: var(--s-2); }
  .zoom { position: absolute; left: var(--s-3); bottom: var(--s-3); display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg-panel); }
  .legend { position: absolute; left: var(--s-3); bottom: 56px; display: none; width: 240px; padding: var(--s-3) var(--s-4); border-radius: var(--r-lg); background: var(--bg-panel); box-shadow: var(--shadow-pop); }
  .legend.open { display: block; }
  .legend .edge-row { display: flex; align-items: center; gap: var(--s-3); height: 26px; font-size: var(--fs-12); color: var(--fg-muted); }
  .legend svg { width: 40px; height: 10px; flex: none; }
  .demo-note { position: absolute; right: var(--s-3); bottom: 48px; }
  /* Keep canvas controls above the bottom drawer */
  .zoom { bottom: 48px; }
  .legend { bottom: 96px; }
  .drawer-open .zoom, .drawer-open .demo-note { bottom: 280px; }
  .drawer-open .legend { bottom: 328px; }
  .node .state { pointer-events: none; }
  .node.dragging { cursor: grabbing; box-shadow: var(--shadow-pop); }
  .node.dim, .group.dim { opacity: 0.35; }

  /* Inspector */
  .inspector { overflow-y: auto; border-left: 1px solid var(--line-soft); background: var(--bg-panel); }
  .insp-head { display: flex; align-items: flex-start; gap: var(--s-3); padding: var(--s-4); }
  .insp-head .glyph { display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-lg); background: var(--bg-raised); color: var(--fg-muted); flex: none; }
  .insp-head .glyph .icon { width: 20px; height: 20px; }
  .insp-title { flex: 1; min-width: 0; }
  .insp-title h1 { margin: 0; font-size: var(--fs-18); font-weight: 600; letter-spacing: -0.01em; }
  .insp-title .sub { color: var(--fg-faint); font-size: var(--fs-12); }
  .insp-state { padding: 0 var(--s-4) var(--s-4); display: flex; gap: var(--s-2); flex-wrap: wrap; }
  .action { display: flex; align-items: center; gap: var(--s-3); width: 100%; min-height: 36px; padding: 0 var(--s-3); margin-bottom: 4px; border: 1px solid var(--line-soft); border-radius: var(--r); background: transparent; cursor: pointer; text-align: left; }
  .action:hover { background: var(--bg-hover); border-color: var(--line); }
  .action .grow { flex: 1; }
  .vault { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3); border: 1px dashed var(--line); border-radius: var(--r); color: var(--fg-muted); }
  .vault .grow { flex: 1; }
  .insp-empty { padding: var(--s-8) var(--s-6); color: var(--fg-faint); text-align: center; }
  .note { padding: var(--s-3); border-radius: var(--r); background: var(--bg-raised); color: var(--fg-muted); font-size: var(--fs-12); }

  /* Breadcrumbs: where you are inside the map */
  .crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .crumbs button { height: 28px; padding: 0 var(--s-2); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg-muted); cursor: pointer; white-space: nowrap; }
  .crumbs button:hover { background: var(--bg-hover); color: var(--fg); }
  .crumbs button[aria-current] { color: var(--fg); font-weight: 600; cursor: default; }
  .crumbs button[aria-current]:hover { background: transparent; }
  .crumbs .sep { color: var(--fg-faint); }

  /* "Go inside" chip on nodes that contain something */
  .kids { display: inline-flex; align-items: center; gap: 2px; height: 20px; padding: 0 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--fg-muted); font-size: var(--fs-11); white-space: nowrap; cursor: pointer; }
  .kids:hover { border-color: var(--lume-dim); color: var(--fg); }
  .node.portal { border-style: dashed; background: transparent; opacity: 0.75; }
  .world.enter { animation: enter var(--t) var(--ease); }
  @keyframes enter { from { opacity: 0; transform-origin: 50% 50%; } }

  /* Places view: summary in group header */
  .place-sum { position: absolute; top: 9px; right: 14px; display: flex; gap: 6px; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <g fill="#3a424c"><circle cx="4" cy="4" r="2"/><circle cx="11" cy="4" r="2"/><circle cx="18" cy="4" r="2"/><circle cx="4" cy="11" r="2"/><circle cx="18" cy="11" r="2"/><circle cx="4" cy="18" r="2"/><circle cx="11" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></g>
          <circle cx="11" cy="11" r="7" fill="rgba(243,238,223,0.12)"/><circle cx="11" cy="11" r="2.6" fill="#f3eedf"/>
        </svg>
      </div>
      <span class="brand-name">Gridlume</span>
    </div>
    <nav class="crumbs" id="crumbs" aria-label="breadcrumbs"></nav>
    <label class="search">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input class="input" id="search" data-i18n-ph="app.search">
      <span class="kbd">/</span>
    </label>
    <div class="spacer"></div>
    <button class="icon-btn" style="position:relative" data-i18n-tip="rail.alerts" data-i18n-label="rail.alerts" id="bell"><span class="alert-count"></span></button>
    <button class="btn btn-sm btn-ghost" id="lang" data-i18n="lang.switch"></button>
    <span class="avatar">OP</span>
  </header>

  <nav class="rail" id="rail"></nav>

  <main class="canvas" id="canvas">
    <div class="world" id="world">
      <div id="groups"></div>
      <svg class="edges" id="edges" width="2000" height="1200"></svg>
      <div id="nodes"></div>
    </div>
    <div class="canvas-tools">
      <button class="btn btn-primary btn-sm" id="add" data-i18n-tip="canvas.add.tip"><span id="add-ic"></span><span data-i18n="canvas.add"></span></button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="zoom">
      <button class="icon-btn" id="zin" data-i18n-tip="canvas.zoomin" data-i18n-label="canvas.zoomin"></button>
      <button class="icon-btn" id="zout" data-i18n-tip="canvas.zoomout" data-i18n-label="canvas.zoomout"></button>
      <button class="icon-btn" id="zfit" data-i18n-tip="canvas.fit" data-i18n-label="canvas.fit"></button>
      <button class="icon-btn" id="zleg" data-i18n-tip="canvas.legend" data-i18n-label="canvas.legend"></button>
    </div>
    <span class="badge demo-note" data-i18n="app.demo"></span>
  </main>

  <aside class="inspector" id="inspector"></aside>
</div>

<!-- Dangerous action: move container -->
<div class="scrim" id="dlg-move">
  <div class="dialog" role="dialog" aria-modal="true">
    <div class="dialog-head"><span class="risk danger" data-i18n="risk.danger"></span><h2 data-i18n="dlg.move.title"></h2><button class="icon-btn" data-close></button></div>
    <div class="dialog-body">
      <p style="margin:0" data-i18n="dlg.move.lead"></p>
      <ol class="steps">
        <li data-i18n="dlg.move.s1"></li>
        <li data-i18n="dlg.move.s2"></li>
        <li data-i18n="dlg.move.s3"></li>
        <li data-i18n="dlg.move.s4"></li>
      </ol>
      <div class="callout warn"><span data-i18n="dlg.move.warn"></span></div>
      <p class="faint" style="margin:10px 0 0;font-size:var(--fs-12)" data-i18n="dlg.move.undo"></p>
      <p style="margin:14px 0 6px" data-i18n="dlg.move.confirm"></p>
      <input class="input mono" style="width:100%" id="move-confirm" placeholder="gridman-api" autocomplete="off">
    </div>
    <div class="dialog-foot">
      <button class="btn btn-ghost" data-close data-i18n="dlg.cancel"></button>
      <button class="btn btn-danger" id="move-go" disabled data-i18n="dlg.move.go"></button>
    </div>
  </div>
</div>

<!-- Generic confirmation, filled by GLAPP.confirm() -->
<div class="scrim" id="dlg-confirm"><div class="dialog" role="dialog" aria-modal="true"></div></div>

<!-- Add a machine -->
<div class="scrim" id="dlg-add">
  <div class="dialog" role="dialog" aria-modal="true">
    <div class="dialog-head"><h2 data-i18n="dlg.add.title"></h2><button class="icon-btn" data-close></button></div>
    <div class="dialog-body">
      <p style="margin:0 0 12px" data-i18n="dlg.add.lead"></p>
      <div class="codeblock"><span style="flex:1">curl -fsSL http://192.168.1.63:7420/agent | sudo sh -s -- <span style="color:var(--lume)">K7QM-2R9X</span></span><button class="btn btn-sm" id="copy-cmd" data-i18n="dlg.copy"></button></div>
      <p class="faint" style="margin:8px 0 16px;font-size:var(--fs-12)" data-i18n="dlg.add.code"></p>
      <div class="row"><span class="dot unknown"></span><span class="grow" data-i18n="dlg.add.wait"></span></div>
    </div>
    <div class="dialog-foot">
      <button class="btn btn-ghost" data-i18n="dlg.add.manual" data-i18n-tip="dlg.add.manual.tip" style="margin-right:auto"></button>
      <button class="btn" data-close data-i18n="dlg.done"></button>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="features/impact-path.js"></script>
<script src="features/problems.js"></script>
<script src="features/drawer.js"></script>
<script src="features/palette.js"></script>
<script src="features/discovery.js"></script>
<script src="features/inspector-extras.js"></script>
<script src="features/pages.js"></script>
<script src="features/polish.js"></script>
</body>
</html>
